      - {name: "P2 Federalism",                          unit: "Political Science", compound: medium, board: true}
      - {name: "P3 Gender, Religion and Caste",          unit: "Political Science", compound: medium, board: true}
      - {name: "P4 Political Parties",                   unit: "Political Science", compound: medium, board: true}
      - {name: "P5 Outcomes of Democracy",               unit: "Political Science", compound: soft,   board: true}
      - {name: "E1 Development",                         unit: Economics, compound: soft,   board: true}
      - {name: "E2 Sectors of the Indian Economy",       unit: Economics, compound: medium, board: true}
