# syllabus-2026-27.yaml — seed syllabus for PIT WALL (CBSE Class X, board exam Feb–Mar 2027).
# Source: official CBSE curriculum 2026-27, https://cbseacademic.nic.in/curriculum_2027.html
# (subject PDFs read on 2026-11-10). Chapter names follow the NCERT / SCERT textbooks.
#
# board:  true     → in the year-end board paper (plan + track)
#         partial  → only the listed subtopics are in the board paper
#         internal → taught and assessed internally only (portfolio/periodic/project); NOT in the board paper
#         false    → excluded ("questions will not be asked")
# compound: suggested difficulty (soft / medium / hard). Editable in the app; it drives the default hours.
# The app plans ONLY board: true|partial. internal/false items are shown greyed, so he knows to skip them.

meta:
  session: "2026-27"
  exam_start: 2027-02-16
  verified: "All five board subjects are taken from the official CBSE 2026-27 PDFs."
  marks_split: "Theory 80 + Internal 20 in each board subject"
  board_subjects: "Maths (Standard 041), Science (086), English L&L (184), Malayalam (012), Social Science (087): confirmed by parent 2026-11-10"

subjects:

  - id: maths
    name: Mathematics
    code: "041 Mathematics STANDARD (confirmed)"
    exam: 2027-02-17
    units:
      - {unit: "Number Systems", marks: 6}
      - {unit: "Algebra", marks: 20}
      - {unit: "Coordinate Geometry", marks: 6}
      - {unit: "Geometry", marks: 15}
      - {unit: "Trigonometry", marks: 12}
      - {unit: "Mensuration", marks: 10}
      - {unit: "Statistics & Probability", marks: 11}
    chapters:
      - {n: 1,  name: "Real Numbers",                         unit: "Number Systems",       compound: soft,   board: true}
      - {n: 2,  name: "Polynomials",                          unit: "Algebra",              compound: soft,   board: true}
      - {n: 3,  name: "Pair of Linear Equations in Two Variables", unit: "Algebra",         compound: medium, board: true, note: "graphical, substitution, elimination (no cross-multiplication)"}
      - {n: 4,  name: "Quadratic Equations",                  unit: "Algebra",              compound: medium, board: true, note: "factorisation + quadratic formula, nature of roots"}
      - {n: 5,  name: "Arithmetic Progressions",              unit: "Algebra",              compound: medium, board: true}
      - {n: 6,  name: "Triangles",                            unit: "Geometry",             compound: hard,   board: true, note: "prove BPT; similarity criteria stated without proof"}
      - {n: 7,  name: "Coordinate Geometry",                  unit: "Coordinate Geometry",  compound: soft,   board: true, note: "distance + section formula (internal division)"}
      - {n: 8,  name: "Introduction to Trigonometry",         unit: "Trigonometry",         compound: hard,   board: true, note: "ratios, standard angles, identities (sin²A+cos²A=1)"}
      - {n: 9,  name: "Some Applications of Trigonometry",    unit: "Trigonometry",         compound: medium, board: true, note: "heights & distances, ≤2 right triangles, angles 30/45/60 only"}
      - {n: 10, name: "Circles",                              unit: "Geometry",             compound: medium, board: true, note: "two tangent theorems (prove)"}
      - {n: 11, name: "Areas Related to Circles",             unit: "Mensuration",          compound: medium, board: true, note: "sector/segment, central angle 60/90/120 only"}
      - {n: 12, name: "Surface Areas and Volumes",            unit: "Mensuration",          compound: hard,   board: true, note: "combinations of any two solids"}
      - {n: 13, name: "Statistics",                           unit: "Statistics & Probability", compound: medium, board: true, note: "grouped mean (direct, assumed, step-deviation), median, mode"}
      - {n: 14, name: "Probability",                          unit: "Statistics & Probability", compound: soft,   board: true}

  - id: science
    name: Science
    code: "086"
    exam: 2027-02-22
    units:
      - {unit: "Chemical Substances – Nature and Behaviour", marks: 25}
      - {unit: "World of Living", marks: 25}
      - {unit: "Natural Phenomena", marks: 12}
      - {unit: "Effects of Current", marks: 13}
      - {unit: "Natural Resources", marks: 5}
    chapters:
      - {name: "Chemical Reactions and Equations",      unit: "Chemical Substances", compound: medium, board: true}
      - {name: "Acids, Bases and Salts",                unit: "Chemical Substances", compound: medium, board: true}
      - {name: "Metals and Non-metals",                 unit: "Chemical Substances", compound: medium, board: true}
      - {name: "Carbon and its Compounds",              unit: "Chemical Substances", compound: hard,   board: true}
      - {name: "Periodic Classification of Elements",   unit: "Chemical Substances", compound: soft,   board: internal, note: "formative only"}
      - {name: "Life Processes",                        unit: "World of Living",     compound: hard,   board: true}
      - {name: "Control and Coordination",              unit: "World of Living",     compound: medium, board: true}
      - {name: "How do Organisms Reproduce?",           unit: "World of Living",     compound: medium, board: true}
      - {name: "Heredity",                              unit: "World of Living",     compound: medium, board: true, note: "⚠ PDF conflict: the syllabus lists Heredity as assessed, but the teacher note says 'Heredity and Evolution will not be assessed'. Keep it in the plan and confirm with the school."}
      - {name: "Evolution (part of Heredity chapter)",  unit: "World of Living",     compound: soft,   board: internal, note: "formative only"}
      - {name: "Light – Reflection and Refraction",     unit: "Natural Phenomena",   compound: hard,   board: true, note: "mirror/lens formula, no derivation"}
      - {name: "The Human Eye and the Colourful World", unit: "Natural Phenomena",   compound: medium, board: true, note: "excludes colour of sun at sunrise/sunset"}
      - {name: "Electricity",                           unit: "Effects of Current",  compound: hard,   board: true}
      - {name: "Magnetic Effects of Electric Current",  unit: "Effects of Current",  compound: medium, board: partial, note: "Motor, Electromagnetic Induction and Generator are formative only; field lines, solenoid, Fleming's LHR, AC/DC and domestic circuits are in the board paper"}
      - {name: "Our Environment",                       unit: "Natural Resources",   compound: soft,   board: true}
    practicals: "14 experiments (pH, reaction types, reactivity, V-I graph, resistors, stomata, CO2 respiration, acetic acid, soap, focal length, glass slab, fission/budding, prism, dicot embryo). Internal 5 marks, but they are also asked in the theory paper; track as one chapter 'Practicals revision'."

