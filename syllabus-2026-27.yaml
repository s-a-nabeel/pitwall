      - {name: "The Making of a Scientist",     unit: Footprints, compound: soft, board: true}
      - {name: "The Necklace",                  unit: Footprints, compound: soft, board: true}
      - {name: "Bholi",                         unit: Footprints, compound: soft, board: true}
      - {name: "The Book That Saved the Earth", unit: Footprints, compound: soft, board: true}
    workbook: "Words and Expressions II: Units 1–4 and 7–11 (grammar/writing practice)"

  - id: malayalam
    name: Malayalam
    code: "012"
    exam: 2027-02-27
    note: "Book: Kerala Padavali Malayalam + Adisthana Padavali, Std X (2025 edition, SCERT Kerala)"
    units:
